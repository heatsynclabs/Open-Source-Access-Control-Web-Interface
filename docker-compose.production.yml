# Production on Coolify: members.heatsynclabs.org.
# Every value comes from the Coolify resource's environment variables; none are
# in git. Nothing is published on the host: Traefik reaches members_web by the
# domain set in Coolify, and only members_web reaches the database (service
# members-db: DATABASE_URL needs a hostname without an underscore).
#
# Door automation (log import every 6 minutes, after-hours lock) runs as Coolify
# scheduled tasks on members_web; see docs/19 in the operations folder.
#
# Door backend: DOOR_BACKEND=door_api sends every door, card and log action
# through production door-api (http://door-api-prod:3000 on the door-net
# network; door-api repo, docker-compose.production.yml). Unset or "legacy"
# talks to the board directly with DOOR_ACCESS_URL and DOOR_ACCESS_PASSWORD,
# which only works while the board is on the lab LAN.
#
# door-net is an internal Docker network created once on the R610
# (docker network create --internal door-net). It must exist before this
# deploys.
services:
  members_web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      members-db:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: postgres://members:${POSTGRES_PASSWORD}@members-db:5432/members
      DOOR_ACCESS_URL: ${DOOR_ACCESS_URL}
      DOOR_ACCESS_PASSWORD: ${DOOR_ACCESS_PASSWORD}
      DOOR_CRON_PASSWORD: ${DOOR_CRON_PASSWORD}
      DOOR_BACKEND: ${DOOR_BACKEND:-legacy}
      DOOR_API_URL: ${DOOR_API_URL}
      DOOR_API_KEY: ${DOOR_API_KEY}
      DOOR_CONTROLLER: ${DOOR_CONTROLLER:-front}
      DOOR_DOORS: ${DOOR_DOORS:-1,2}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_TLS: ${SMTP_TLS}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_KEY: ${S3_KEY}
      S3_SECRET: ${S3_SECRET}
    networks:
      - door-net
    healthcheck:
      # Reads the cached door state from the database; never contacts the board.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:3000/space_api/simple.json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  members-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: members
      POSTGRES_DB: members
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - members_pg16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U members -d members"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  members_pg16:

networks:
  door-net:
    external: true
    name: door-net
