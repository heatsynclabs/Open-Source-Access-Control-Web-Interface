version: "3"
services:
  members_web:
    restart: 'unless-stopped'
    container_name: members_web
    build:
      # target: dev
      context: .
    depends_on:
      members_postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Dummy values so Paperclip/aws-sdk-s3 initialize for local testing.
      # Uploads will not reach a real bucket; viewing pages works.
      S3_BUCKET: "members-dev-bucket"
      S3_KEY: "dummy-key"
      S3_SECRET: "dummy-secret"
      DOOR_ACCESS_URL: ${DOOR_ACCESS_URL:-http://172.22.110.99}
      DOOR_ACCESS_PASSWORD: ${DOOR_ACCESS_PASSWORD:-}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-inbucket}
      SMTP_PORT: "${SMTP_PORT:-10025}"
    # volumes:
      # Uncomment and use volume overlays to easily edit the app as a developer
      # - .:/app

  members_postgres:
    container_name: members_postgres
    image: postgres:9.6.1-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_MULTIPLE_DATABASES: members_db_development,members_db_test
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      # Script to create users/DBs according to POSTGRES_MULTIPLE_DATABASES
      - ./pg-init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  inbucket:
    image: inbucket/inbucket:3.0.4
    restart: always
    ports:
      - 10001:10001 # inbucket web ui
    environment:
      INBUCKET_WEB_ADDR: "0.0.0.0:10001"
      INBUCKET_POP3_ADDR: "0.0.0.0:10110"
      INBUCKET_SMTP_ADDR: "0.0.0.0:10025"

volumes:
  db_data:
    driver: local
